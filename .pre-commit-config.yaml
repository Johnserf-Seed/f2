repos:
# Shell check
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
        # pybabel 生成的 .po 以空行结尾，保持与工具输出一致
        exclude: ^f2/languages/.*\.po$
    -   id: check-yaml

# Python linters
-   repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
    -   id: isort
        args: ["--profile", "black"]

# Python formatters
-   repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
    -   id: black
        language_version: python3

# Python type checker
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
    -   id: mypy
        additional_dependencies: [types-protobuf, types-aiofiles, types-requests]
        args: [--ignore-missing-imports, --config-file=pyproject.toml]
        exclude: ^(f2/apps/(douyin|tiktok)/proto/.*_pb2\.py|docs/snippets/.*\.py|f2-secrets/.*\.py|tests/.*\.py)$

# Python security checks
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
    -   id: gitleaks
        args: ["--verbose"]
