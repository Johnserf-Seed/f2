name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: ruff
        run: ruff check .

      - name: black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: mypy
        run: mypy f2/

      # 依赖库的类型标注可能按 Python 版本区分（如 curl_cffi 只在 3.13+ 给类型参数设默认值），
      # 再按最低支持的版本检查一次
      - name: mypy (Python 3.11)
        run: mypy --python-version 3.11 f2/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .[dev]

      # 带 network 标记的用例（f2/apps/*/test 与版本检查）需要真实平台接口与凭据，CI 不跑
      - name: Run offline tests
        run: pytest -m "not network" --cov=f2 --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Johnserf-Seed/f2
          files: coverage.xml
          fail_ci_if_error: false

  # 测试矩阵安装的是版本范围内的最新版本，这里再用下限版本跑一次
  test-lowest:
    name: Test (lowest websockets / protobuf)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .[dev] "websockets==15.0.1" "protobuf==5.29.6"

      - name: Run offline tests
        run: pytest -m "not network"

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      # 在干净环境里安装 wheel：入口可运行，且导入应用模块不需要网络
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/f2 --version
          cd /tmp && /tmp/smoke/bin/python -c "import f2.apps.douyin.model, f2.apps.tiktok.model"

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
