name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wheel-contents:
    name: Wheel contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build check-wheel-contents

      - name: Build wheel and sdist
        run: python -m build

      - name: Check wheel layout
        run: check-wheel-contents dist/*.whl

      - name: Assert tests and test config are not shipped
        run: |
          if unzip -l dist/*.whl | grep -E "f2/apps/[a-z_]+/test/|f2/conf/test(\.local)?\.yaml"; then
            echo "::error::wheel contains test files or test config"
            exit 1
          fi
          if tar tzf dist/*.tar.gz | grep -E "f2/conf/test\.local\.yaml"; then
            echo "::error::sdist contains local test config"
            exit 1
          fi
          echo "wheel and sdist contents OK"
