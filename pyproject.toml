[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f2"
dynamic = ["version"]
description = "🚀Asynchronous based full-platform download tool"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/Johnserf-Seed/f2"
requires-python = ">=3.11"
authors = [
    { name = "Johnserf-Seed", email = "support@f2.wiki" },
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: Customer Service",
    "License :: OSI Approved :: Apache Software License",
    "Framework :: AsyncIO",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Environment :: Plugins",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
]

keywords = [
    "async",
    "websockets",
    "crawler",
    "downloader",
    "internet",
    "download",
    "f2",
    "http",
    "https",
    "ws",
    "wss",
    "bark",
    "tiktok",
    "douyin",
    "twitter",
    "x",
    "weibo",
    "bilibili",
    "netease",
    "http proxy",
    "watermark",
]

# 作为库发布，运行时依赖使用版本范围而不是 ==：下限是已验证可用（或已修复已知漏洞）的版本，
# 上限是离线测试与 CLI 冒烟验证过的最新版本的下一个大版本。
dependencies = [
    "click>=8.3.3,<9",
    "rich>=13.9.3,<16",
    "httpx>=0.28.1,<0.29",
    # 0.10.x 依赖 sniffio 却未声明，anyio>=4.10 不再附带 sniffio 时全新安装会 ImportError
    "httpx-socks>=0.11.0,<0.14",
    # TikTok 网页接口会校验 TLS 与 HTTP/2 指纹，httpx 发出的请求只会得到空内容，由它模拟 Chrome 发送（#384）
    "curl_cffi>=0.16.3,<0.17",
    "aiofiles>=24.1.0,<26",
    "aiosqlite>=0.20.0,<0.23",
    "ruamel.yaml>=0.18.10,<0.20",
    "jsonpath-ng>=1.6.1,<2",
    "m3u8>=3.6.0,<7",
    "browser_cookie3>=0.20.1,<0.21",
    # pydantic 2.12 起才支持 Python 3.14（pydantic-core 的 3.14 wheel 与延迟求值的注解）
    "pydantic>=2.9,<3; python_version < '3.14'",
    "pydantic>=2.12,<3; python_version >= '3.14'",
    # 15 起新版 asyncio 接口原生支持 HTTP 与 SOCKS 代理
    "websockets>=15.0.1,<18",
    # *_pb2.py 由 protoc 5.29.3 生成，运行时版本不能低于它；6.x、7.x 实测可以直接使用
    "protobuf>=5.29.6,<8",
    "gmssl>=3.2.2,<4",
    "cryptography>=44.0.1,<51",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "babel>=2.14.0,<3",
    "mypy-protobuf>=3.6.0,<6",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "black==26.5.1",
    "isort==6.0.1",
    "ruff==0.16.9",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "types-aiofiles",
    "types-protobuf",
    "coverage",
    "pytest-cov",
]

[project.scripts]
f2 = "f2.cli.cli_commands:main"

[project.urls]
Homepage = "https://github.com/Johnserf-Seed/f2"
Documentation = "https://f2.wiki/"
Chat = "https://discord.gg//3PhtPmgHf8"
"Source Code" = "https://github.com/Johnserf-Seed/f2"
"Issue Tracker" = "https://github.com/Johnserf-Seed/f2/issues"

[tool.hatch.version]
path = "f2/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/f2",
]
exclude = [
    "f2/conf/test.local.yaml",
]

[tool.hatch.build.targets.wheel]
exclude = [
    "f2/languages/*/LC_MESSAGES/*.po",
    "f2/apps/*/test/",
    "f2/conf/test.yaml",
    "f2/conf/test.local.yaml",
]

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true # 与 black/ruff 一致，跳过被 git 忽略的本地目录（如 f2-secrets）

[tool.black]
line-length = 88
target-version = ['py311']

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "f2/apps"]
markers = [
    "apps: 各平台接口用例",
    "network: 需要访问真实网络或平台接口的用例，CI 中以 -m \"not network\" 跳过",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "f2/apps/*/proto/*_pb2.py",
    "f2/apps/*/proto/*_pb2.pyi",
    "docs/",
]

[tool.ruff.lint]
# 与 black/isort 分工：ruff 只负责语法错误、未定义名与未使用导入/变量等正确性检查
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
exclude = [
    "f2/apps/(douyin|tiktok)/proto/.*_pb2\\.py",
    "docs/snippets/",
    "f2-secrets/",
    "tests/"
]

[[tool.mypy.overrides]]
module = "ruamel.*"
ignore_missing_imports = true
check_untyped_defs = true
